server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name rag.yyh.world 121.41.82.207 _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://rag.yyh.world$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name rag.yyh.world 121.41.82.207 _;

    ssl_certificate /etc/letsencrypt/live/rag.yyh.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rag.yyh.world/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    auth_basic "RAG";
    auth_basic_user_file /etc/nginx/.htpasswd-rag;
    client_max_body_size 100m;

    location = /api/me {
        default_type application/json;
        return 200 '{"user":"$remote_user","users":[],"is_admin":true}';
    }

    location = /login {
        return 302 /;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-ID $remote_user;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
