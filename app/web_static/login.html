<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <title>登录知识库工作台</title>
  <link rel="stylesheet" href="/static/login.css">
  <script src="/static/js/login.js" defer></script>
</head>
<body>
  <div class="login-shell">
    <aside class="brand-panel" aria-labelledby="brand-title">
      <div class="brand-mark" aria-hidden="true">R</div>
      <div class="brand-copy">
        <h1 id="brand-title">知识库工作台</h1>
        <p>统一管理资料检索、智能问答与文档权限。</p>
      </div>

      <ul class="feature-list">
        <li>
          <span class="feature-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12"/><path d="M8 9h8M8 13h5"/><path d="M3 19h18"/></svg>
          </span>
          <div>
            <strong>结构化知识库</strong>
            <span>保留章节与来源，便于追溯答案。</span>
          </div>
        </li>
        <li>
          <span class="feature-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v5c0 4.5-3.2 7.9-8 9-4.8-1.1-8-4.5-8-9V7z"/><path d="m9 12 2 2 4-4"/></svg>
          </span>
          <div>
            <strong>权限隔离</strong>
            <span>不同角色只查看被授权的内容。</span>
          </div>
        </li>
        <li>
          <span class="feature-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a3 3 0 0 1-3 3H8l-5 3V6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3z"/></svg>
          </span>
          <div>
            <strong>可追溯问答</strong>
            <span>展示证据片段、检索方式与耗时。</span>
          </div>
        </li>
      </ul>

      <p class="brand-footer">由 Let’s Encrypt HTTPS 保护</p>
    </aside>

    <main class="login-panel">
      <section class="login-card" aria-labelledby="form-title">
        <div class="mobile-brand" aria-hidden="true">R</div>
        <h2 id="form-title">登录</h2>
        <p class="login-subtitle">使用管理员分配的账号继续</p>

        <form id="login-form" novalidate>
          <label for="username">用户名</label>
          <input
            id="username"
            name="username"
            type="text"
            inputmode="username"
            autocomplete="username"
            spellcheck="false"
            required
          >

          <label for="password">密码</label>
          <div class="password-box">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            >
            <button id="toggle-password" class="toggle-password" type="button" aria-label="显示密码" aria-pressed="false">
              <svg class="icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.2A9.8 9.8 0 0 1 12 5c6.5 0 10 6 10 6a17 17 0 0 1-3 3.6"/><path d="M6.6 6.6C4 8.3 2 12 2 12s3.5 6 10 6c1.5 0 2.9-.3 4.1-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
          </div>

          <div class="form-options">
            <label class="checkbox">
              <input id="remember-username" type="checkbox" checked>
              <span>记住用户名</span>
            </label>
            <span id="caps-lock" class="caps-lock" hidden>大写锁定已开启</span>
          </div>

          <button id="login-button" class="login-button" type="submit">
            <span class="button-text">登录</span>
            <span class="spinner" aria-hidden="true"></span>
          </button>

          <p id="message" class="form-message" role="alert" aria-live="polite"></p>
          <p class="support-note">忘记密码或需要账号？请联系管理员。</p>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
