<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <title>登录知识库工作台</title>
  <style>
    body { min-height: 100vh; display: grid; place-items: center; margin: 0;
      background: #f6f5f1; color: #211f1c;
      font: 14px/1.6 -apple-system, "PingFang SC", "Segoe UI", sans-serif; }
    main { width: min(380px, calc(100vw - 40px)); padding: 26px;
      border: 1px solid #e7e4dd; border-radius: 8px; background: #fff; }
    h1 { font-size: 19px; margin: 0 0 18px; }
    label { display: block; margin: 14px 0 5px; font-size: 13px; color: #6e6a62; }
    input { width: 100%; height: 36px; padding: 0 10px; box-sizing: border-box;
      border: 1px solid #d6d2c9; border-radius: 6px; font: inherit; }
    button { width: 100%; height: 38px; margin-top: 20px; border: 0; border-radius: 6px;
      background: #2e6b4e; color: #fff; font: inherit; cursor: pointer; }
    button:disabled { opacity: .65; cursor: not-allowed; }
    p { min-height: 20px; margin: 12px 0 0; font-size: 13px; color: #a83c2c; }
  </style>
  <script src="/static/js/login.js" defer></script>
  </head>
<body>
  <main>
    <h1>知识库工作台</h1>
    <form id="login-form">
      <label for="username">用户名</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">登录</button>
      <p id="message" role="alert"></p>
    </form>
  </main>
</body>
</html>
